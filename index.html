<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Galeria de um Programador</title>
  </head>

  <body>
    <div class="topo">
      <h1>Galeria de um Programador</h1>

      <p class="descricao">
        Entre códigos, bugs e café, alguns registros da rotina de quem
        transforma ideias em software.
      </p>
    </div>

    <div class="galeria">
      <figure>
        <img src="assets/images/code.jpg" alt="Código sendo desenvolvido" />

        <figcaption>
          Algumas linhas de código e provavelmente alguns bugs.
        </figcaption>
      </figure>

      <figure>
        <img src="assets/images/setup.jpg" alt="Setup de um programador" />

        <figcaption>Onde tudo começa café, código e algumas ideias.</figcaption>
      </figure>

      <figure>
        <iframe
          src="https://www.youtube.com/embed/xTXezVbTipA"
          title="Rotina de um programador trabalhando de casa"
          allowfullscreen
        ></iframe>

        <figcaption>
          Vídeo sobre a rotina de um programador trabalhando de casa.
        </figcaption>
      </figure>

      <figure>
        <iframe
          src="https://www.youtube.com/embed/Zwu2HjU7pXY"
          title="Um dia na vida de um desenvolvedor de software"
          allowfullscreen
        ></iframe>

        <figcaption>
          Entre código e reuniões um dia na vida de um desenvolvedor.
        </figcaption>
      </figure>

      <figure class="audio-card">
        <audio controls>
          <source
            src="https://server1.mtabrasil.com.br/play?id=C55zjPlqdYw"
            type="audio/mpeg"
          />
        </audio>

        <figcaption>Deep Focus Mix para programação e codificação.</figcaption>
      </figure>

      <figure class="audio-card">
        <audio controls>
          <source
            src="https://server1.mtabrasil.com.br/play?id=MX-iaTDEyGI"
            type="audio/mpeg"
          />
        </audio>

        <figcaption>Música para Estudar e manter o Foco.</figcaption>
      </figure>
    </div>
  </body>
</html>
